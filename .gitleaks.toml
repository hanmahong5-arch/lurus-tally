# gitleaks configuration for 2b-svc-tally
#
# Base = 2c-svc-lucrum's ruleset (internal API key / shared ops password /
# k8s literal password) fused with 2b-svc-newapi's DSN-with-credentials rule,
# per the platform-wide 2026-08 secret-scanning rollout. Extends the upstream
# default ruleset (generic API keys, cloud provider creds, private keys, JWTs).
#
# Run locally:  gitleaks detect --no-git --config .gitleaks.toml --redact -v
# Staged only:  gitleaks protect --staged --config .gitleaks.toml --redact -v

title = "tally secret scanning"

[extend]
useDefault = true

# --- Rule 1: cross-service internal API key (64-hex) ------------------------
[[rules]]
id = "lurus-internal-api-key"
description = "Lurus cross-service internal API key (64-hex) committed in plaintext"
regex = '''(?i)(lurus[_-]?identity[_-]?internal[_-]?key|internal[_-]?api[_-]?key|lurus[_-]?api[_-]?key)["'\s]*[:=]["'\s]*([a-f0-9]{64})'''
secretGroup = 2
keywords = [
  "lurus_identity_internal_key",
  "internal_api_key",
  "lurus_api_key",
  "lurus-identity-internal-key",
]
[rules.allowlist]
regexes = [
  '''(?i)(changeme|placeholder|replace[_-]?me|example|dummy|<[^>]+>|\$\{[^}]+\}|\$\([^)]+\)|base64-encoded)''',
  '''^0{64}$''',
  '''^f{64}$''',
]

# --- Rule 2: shared Lurus ops password -------------------------------------
[[rules]]
id = "lurus-shared-ops-password"
description = "Shared Lurus infrastructure password (cluster PG / Zitadel admin / Mail) in plaintext"
regex = '''Lurus(@|%40|%2540)ops'''
keywords = ["lurus@ops", "lurus%40ops"]

# --- Rule 3: literal password values in k8s Secret / env assignments --------
[[rules]]
id = "k8s-literal-password"
description = "Literal password value assigned to a *_PASSWORD / *_SECRET / *_TOKEN key"
regex = '''(?i)\b([a-z0-9_-]*(?:password|passwd|secret|token))["'\s]*[:=][ \t]*["']([^"'\s$<{][^"'\n]{7,})["']'''
secretGroup = 2
keywords = ["password", "passwd", "secret", "token"]
[rules.allowlist]
regexes = [
  '''(?i)(changeme|placeholder|replace[_-]?me|example|dummy|sample|test[_-]?only|your[_-]|xxx+|redacted|\*{4,})''',
  '''(\$\{[^}]+\}|\$\([^)]+\)|\{\{[^}]+\}\}|<[^>]+>|base64-encoded)''',
  '''(?i)(secretKeyRef|valueFrom|secretName|configMapKeyRef)''',
  '''^[A-Za-z0-9_.-]+$''',
  '''^/''',
]

# --- Rule 4: connection string / DSN with embedded credentials --------------
[[rules]]
id = "lurus-dsn-with-credentials"
description = "Connection string / DSN carrying an embedded username:password"
regex = '''(?i)\b[a-z][a-z0-9+.-]*://[a-z0-9_.-]+:([^@\s"'/]{6,})@[a-z0-9_.-]+(:[0-9]+)?/'''
secretGroup = 1
keywords = [
  "postgres://", "postgresql://", "mysql://", "redis://", "mongodb://", "amqp://",
]
[rules.allowlist]
regexes = [
  '''(?i)(changeme|placeholder|replace[_-]?me|replace[_-]?\w*|example|dummy|user|password|localhost|127\.0\.0\.1|<[^>]+>|\$\{[^}]+\}|\$\([^)]+\))''',
]

# --- Rule 5: relay-style API key (sk- + long alnum / Langfuse pk-lf-/sk-lf-) -
# Closes the blind spot found 2026-08: a real newapi relay key (sk- + 48
# alnum) sat in a sibling repo and neither the default ruleset nor rules 1-4
# above matched it.
[[rules]]
id = "lurus-relay-key"
description = "Lurus newapi/relay style API key (sk- + long alnum) or Langfuse key pair"
regex = '''\bsk-[A-Za-z0-9]{30,}\b|\b[ps]k-lf-[a-z0-9-]{16,}\b'''
keywords = ["sk-", "pk-lf-"]
[rules.allowlist]
regexes = [
  # deploy/langfuse/README.md documents the key *shape* with all-x
  # placeholders (pk-lf-xxxxxxxxxxxxxxxx / sk-lf-xxxxxxxxxxxxxxxx).
  '''[ps]k-lf-x{8,}''',
]

# --- Global allowlist -------------------------------------------------------
[allowlist]
description = "Paths / values that never contain live credentials"
paths = [
  # dependency / build artifacts
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)coverage/''',
  '''(^|/)target/''',
  '''(^|/)html/''',
  '''\.lock$''',
  '''(^|/)bun\.lock(b)?$''',
  '''(^|/)package-lock\.json$''',
  '''\.(png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|pdf|exe)$''',
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)gitleaks\.sarif$''',
  '''(^|/)gitleaks-report\.json$''',
  # git internals / operator scratch worktrees — not source, huge + slow to walk
  '''(^|/)\.git/''',
  '''(^|/)\.claude/worktrees/''',
  # Test fixtures: assertions need literal throwaway credentials.
  '''(^|/)__tests__/''',
  '''(^|/)tests?/''',
  '''(^|/)e2e/''',
  '''\.(test|spec)\.[jt]sx?$''',
  '''(^|/)test_[^/]+\.py$''',
  '''[^/]+_test\.(go|py)$''',
  '''(^|/)playwright-report[^/]*/''',
  '''(^|/)test-results[^/]*/''',
  # UAT-only local dev env with fixed weak dev DSN password ("tallysecret",
  # localhost only); real prod creds live in the gitignored root 重要信息.md.
  '''(^|/)\.env\.uat$''',
  '''(^|/)\.env\.example$''',
  # planning docs — DSN examples are generic ("yourpassword"/"tallysecret"
  # @localhost), documentation text, never real infra.
  '''(^|/)_bmad-output/''',
  '''(^|/)_research/''',
  # UAT evidence archive: raw HTTP bodies captured from automated test runs
  # (PAT tokens scoped to throwaway UAT tenants). Already .gitignore'd
  # (_uat-reports/evidence/) — never committed; excluded here only so the
  # local --no-git working-tree scan doesn't trip on it too.
  '''(^|/)_uat-reports/evidence/''',
  # k8s Secret template — every value is base64("placeholder") except two
  # REPLACE_AT_DEPLOY markers; see file header comment.
  '''(^|/)deploy/k8s/base/secret\.yaml$''',
]
regexes = [
  '''(?i)placeholder''',
  '''example\.com''',
]
