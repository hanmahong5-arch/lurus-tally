# S0.D — Kill-switch monitor CronJob.
#
# Fires every Monday at 09:00 Beijing time (UTC 01:00).  Uses the same
# backend image as the tally-backend deployment; the binary /kill-switch-monitor
# is compiled from cmd/kill-switch-monitor/ and must be present in the image.
# NOTE: The Dockerfile must be updated to produce this second binary — see
# the follow-up section in internal/alert/README.md.
#
# Volume strategy (follow-up required):
#   assumptions.md is read from a hostPath mount at /repo. This is a placeholder
#   for the first 10-customer phase. Production alternative: a git-sync sidecar
#   or a ConfigMap generated by bin/assumption-snapshot.sh CI step. See README.
#
# Hard rule (lurus/CLAUDE.md R6 磁盘): this job is read-only and writes nothing
# to disk, so no emptyDir or PVC is needed beyond the hostPath /repo mount.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tally-killswitch
  namespace: lurus-tally
  labels:
    app.kubernetes.io/name: tally-killswitch
    app.kubernetes.io/part-of: tally
    app.kubernetes.io/component: monitor
spec:
  # Every Monday at 09:00 Beijing (UTC+8) = Monday 01:00 UTC.
  schedule: "0 1 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4  # keep ~1 month of Monday runs
  failedJobsHistoryLimit: 4
  startingDeadlineSeconds: 1800
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800  # 7d — keep for the following Monday's review
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: kill-switch-monitor
              # PLACEHOLDER must be replaced before apply.  Options:
              #   (a) sed: sed -i "s/main-PLACEHOLDER/main-$(git rev-parse --short HEAD)/" cronjob-killswitch.yaml
              #   (b) Kustomize: use images[].newTag in an overlay kustomization.yaml
              #   (c) ArgoCD ApplicationSet: pass sha7 via generators params
              # Never kubectl apply this file with the literal string "main-PLACEHOLDER" —
              # the pod will enter ImagePullBackOff until the tag is substituted.
              image: ghcr.io/hanmahong5-arch/lurus-tally-backend:main-PLACEHOLDER
              imagePullPolicy: Always
              command: ["/kill-switch-monitor"]
              env:
                - name: ASSUMPTIONS_FILE
                  value: /repo/_bmad-output/planning-artifacts/assumptions.md
                - name: FEISHU_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: tally-killswitch-secrets
                      key: FEISHU_WEBHOOK_URL
                      optional: true   # sender skips gracefully when absent
                - name: SMTP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: tally-killswitch-secrets
                      key: SMTP_HOST
                      optional: true
                - name: SMTP_PORT
                  valueFrom:
                    secretKeyRef:
                      name: tally-killswitch-secrets
                      key: SMTP_PORT
                      optional: true
                - name: SMTP_USER
                  valueFrom:
                    secretKeyRef:
                      name: tally-killswitch-secrets
                      key: SMTP_USER
                      optional: true
                - name: SMTP_PASS
                  valueFrom:
                    secretKeyRef:
                      name: tally-killswitch-secrets
                      key: SMTP_PASS
                      optional: true
                - name: SMTP_FROM
                  valueFrom:
                    secretKeyRef:
                      name: tally-killswitch-secrets
                      key: SMTP_FROM
                      optional: true
                - name: SMTP_TO
                  valueFrom:
                    secretKeyRef:
                      name: tally-killswitch-secrets
                      key: SMTP_TO
                      optional: true
              volumeMounts:
                - name: repo
                  mountPath: /repo
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: repo
              # FOLLOW-UP(仍未做,2026-09-07 复核):替换成 git-sync sidecar 或
              # ConfigMap 注入。下面三条路都**实测过**,各自被一堵墙挡住,所以这
              # 不是「随手就能改」——留给需要它的人别再重新撞一遍:
              #   1) kustomize configMapGenerator 读仓根的 assumptions.md →
              #      被安全策略拒绝(file not in or below .../deploy/k8s/base),
              #      除非全员改用 --load-restrictor LoadRestrictionsNone。
              #   2) 烤进镜像(COPY 到 /app)→ .dockerignore:6 排除了 _bmad-output/,
              #      探针构建实测 "not found";要走这条得先给 .dockerignore 开口子。
              #   3) 保持 hostPath → 需要有人真的把仓放到 R6 的这个路径上;
              #      这正是 Sprint 0 说好的手工步骤,而它从 2026-06-08 起就没人做。
              #
              # 🔴 type 从 DirectoryOrCreate 改成 Directory(2026-09-07):
              # DirectoryOrCreate 会**静默创建一个空目录**,于是挂载「成功」、容器
              # 起来、程序找不到文件、每周失败一次 —— 而失败原因藏在早已被 GC 的
              # pod 日志里。实测:/data/repos/lurus-tally 是空的,mtime 2026-06-08
              # 01:00,正是该任务首次触发的时刻;它从未成功过。
              # 改成 Directory 后,路径不存在会让 pod 直接卡在无法挂载并把原因写在
              # 事件里 —— 同样是坏的,但**坏得看得见**,不用去翻已经没有的日志。
              hostPath:
                # 需要 R6 节点上真实存在的 checkout 路径(见上面第 3 条)。
                path: /data/repos/lurus-tally
                type: Directory
