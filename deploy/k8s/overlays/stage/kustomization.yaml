apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # STAGE uses an isolated OIDC provider instance at test-auth.lurus.cn so
  # staging traffic never authenticates against the production tenant.
  # base/configmap.yaml ships the PROD issuer (identity.lurus.cn since the
  # 2026-05-21 cutover). NOTE (operator): confirm test-auth.lurus.cn is still a
  # live, separate STAGE issuer; if it was folded into identity.lurus.cn, drop
  # these two issuer patches so STAGE inherits the canonical issuer from base.
  - patch: |-
      - op: replace
        path: /data/OIDC_ISSUER
        value: test-auth.lurus.cn
    target:
      kind: ConfigMap
      name: tally-config
  # Load the 199-entry nursery dictionary on boot. The loader has existed since
  # Epic 1 (lifecycle/start.go: idempotent, non-fatal on failure) but no
  # environment ever set the flag, so the dictionary has never been loaded
  # anywhere. STAGE opts in; PROD stays owner-gated until a prod deploy exists.
  - patch: |-
      - op: add
        path: /data/SEED_NURSERY_DICT
        value: "true"
    target:
      kind: ConfigMap
      name: tally-config
  # STAGE web must sign users in against the STAGE issuer too, or the id_token's
  # `iss` won't match the backend's OIDC_ISSUER (test-auth) → backend 401.
  - patch: |-
      - op: replace
        path: /data/OIDC_ISSUER
        value: https://test-auth.lurus.cn
    target:
      kind: ConfigMap
      name: tally-web-config
  # R6 STAGE fronts traffic with a node-level nginx (no in-cluster Traefik
  # IngressRoute), so services MUST expose stable NodePorts to match
  # /etc/nginx/sites-enabled/lurus-stage upstream (127.0.0.1:30820 / 30830).
  # base/service*.yaml uses ClusterIP which is correct for PROD (Traefik).
  - patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30820
    target:
      kind: Service
      name: tally-backend
  - patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30830
    target:
      kind: Service
      name: tally-web
  # Drop the base placeholder Secret, as the PROD overlay does: applying it
  # would overwrite the hand-seeded `tally-secrets` per key. STAGE used to
  # survive only because base/secret.yaml's REPLACE_AT_DEPLOY values are
  # invalid base64 and the API server rejected that one object.
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: tally-secrets
        namespace: lurus-tally
      $patch: delete
images:
  # main-0b25ecf (2026-09-27): CI-green main; backend: address forms no longer
  # misfile everyday words (老顾客/小时…) under a customer, alias-attributed
  # notes are marked and announced, Chat/StreamChat share one loop, memory
  # op counters + per-turn log (c6f135e4); tool schemas generated from the
  # argument structs (0b25ecfd). No migrations, web tree identical.
  # main-81d56b3 (2026-09-26): backend adds today's date to
  # the AI prompt (81d56b38). Before it, main-a3d1fcc replaced the hand-set
  # main-4ed56b0 (this file then said main-0d59b14): no migrations, web tree
  # identical, backend gained the AI drawer's memory fixes and 熟客记忆
  # (8963382e..cf70c49e).
  # History: main-0d59b14 (2026-08-08) was the first image after a 37-day CI
  # outage and ran migrations 53→55; see git log of this file.
  - name: ghcr.io/hanmahong5-arch/lurus-tally-backend
    newTag: main-0b25ecf
  - name: ghcr.io/hanmahong5-arch/lurus-tally-web
    newTag: main-0b25ecf
