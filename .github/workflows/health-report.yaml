# S0.C3 — Monday 09:00 Beijing weekly Feishu health post via
# bin/health-report.sh. Hosted runner for the same reason as
# assumption-snapshot: stable schedule with no node dependency.
#
# The report is ALWAYS written to the job summary, so it is readable without
# any secret configured. Feishu delivery is best-effort on top of that:
# an unset HEALTH_REPORT_FEISHU_URL emits a ::warning:: and exits 0 (infra
# gap), while a configured-but-failing webhook still fails the run (real
# incident). Before 2026-08-18 both cases failed identically, so the weekly
# red told you nothing about which had happened.
#
# Secrets:
#   HEALTH_REPORT_FEISHU_URL  — primary Feishu webhook (unset → warn + skip send)
#   OPS_ALERT_FEISHU          — fallback pinged on real send failures
#   PROM_URL                  — Prometheus base URL (optional; n/a if missing)
name: health-report

on:
  schedule:
    # Monday 01:00 UTC = 09:00 Beijing.
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: Run health report
        env:
          HEALTH_REPORT_FEISHU_URL: ${{ secrets.HEALTH_REPORT_FEISHU_URL }}
          OPS_ALERT_FEISHU: ${{ secrets.OPS_ALERT_FEISHU }}
          PROM_URL: ${{ secrets.PROM_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: bash bin/health-report.sh
