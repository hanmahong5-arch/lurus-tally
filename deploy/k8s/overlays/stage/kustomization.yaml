apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # STAGE uses an isolated OIDC provider instance at test-auth.lurus.cn so
  # staging traffic never authenticates against the production tenant.
  # base/configmap.yaml ships the PROD issuer (identity.lurus.cn since the
  # 2026-05-21 cutover). NOTE (operator): confirm test-auth.lurus.cn is still a
  # live, separate STAGE issuer; if it was folded into identity.lurus.cn, drop
  # these two issuer patches so STAGE inherits the canonical issuer from base.
  - patch: |-
      - op: replace
        path: /data/OIDC_ISSUER
        value: test-auth.lurus.cn
    target:
      kind: ConfigMap
      name: tally-config
  # STAGE web must sign users in against the STAGE issuer too, or the id_token's
  # `iss` won't match the backend's OIDC_ISSUER (test-auth) → backend 401.
  - patch: |-
      - op: replace
        path: /data/OIDC_ISSUER
        value: https://test-auth.lurus.cn
    target:
      kind: ConfigMap
      name: tally-web-config
  # R6 STAGE fronts traffic with a node-level nginx (no in-cluster Traefik
  # IngressRoute), so services MUST expose stable NodePorts to match
  # /etc/nginx/sites-enabled/lurus-stage upstream (127.0.0.1:30820 / 30830).
  # base/service*.yaml uses ClusterIP which is correct for PROD (Traefik).
  - patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30820
    target:
      kind: Service
      name: tally-backend
  - patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30830
    target:
      kind: Service
      name: tally-web
images:
  # Bumped to main-0d59b14 (2026-08-08) — the first main commit since 2026-07-02
  # that produces images at all: two branches had both numbered a migration
  # 000053, and golang-migrate refuses to load the WHOLE set on a version
  # collision, so CI's Integration Test stayed red and BOTH image-build jobs were
  # skipped for 37 days. Fixed in 4cbbae56 (renumber → 000055) + 9f14658d (two
  # never-`git add`ed web modules that kept the frontend typecheck red).
  #
  # 🔴 OPERATOR — this is NOT a routine tag bump, read before `kubectl apply -k`:
  #  1. What was DECLARED here (main-e02788a, 2026-06-18) predates 06b1c3cd,
  #     the CRITICAL fix rejecting a client-supplied X-IDP-Subject on /billing/*
  #     (cross-account impersonation). What is RUNNING on R6 is older still
  #     (backend main-ba458ba 2026-06-16 / web main-da39944) — so STAGE has been
  #     drifted behind its own declaration, not just behind main.
  #  2. Boot runs migrations 53→55: 000053 DROPs the dead reorder views AND the
  #     product.predicted_* columns (down/ restores them), 000054 backfills the
  #     supplier→partner mirror, 000055 creates usage_report_outbox. Take a
  #     STAGE dump first — the schema change is the reason this is owner-gated.
  #  3. The runbook's `ssh root@100.122.83.20` (Tailscale) is dead; the live
  #     channel is `ssh -p 12222 root@43.226.45.87`.
  - name: ghcr.io/hanmahong5-arch/lurus-tally-backend
    newTag: main-0d59b14
  - name: ghcr.io/hanmahong5-arch/lurus-tally-web
    newTag: main-0d59b14
